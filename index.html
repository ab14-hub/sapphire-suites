<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sapphire Suites | Premium apartments in Islamabad</title><meta name="description" content="Premium furnished apartments in Islamabad. Book direct on WhatsApp."><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#0a1d3b;--sap:#1c4bb8;--gold:#c9a45c;--cream:#f8f4ec;--ink:#13203a}

<main id="app" hidden></main><footer id="foot"></footer><script>(async()=>{const D=await(await fetch('/data/site.json',{cache:'no-cache'})).json();const IMG={};D.listings.forEach(x=>{x.sections=(x.sections||[]).map(z=>({...z,images:z.images||[]}));x.amenities=x.amenities||[];x.cover=x.cover||x.sections.flatMap(z=>z.images)[0]||''});

$$('.card').forEach((c,k)=>{const x=L[k],ims=[...new Set(x.sections.flatMap(s=>s.images))],img=$('.in2 img',c);let t,n=0;c.addEventListener('mouseenter',()=>{t=setInterval(()=>{n=(n+1)%ims.length;img.src=raw(ims[n])},900)});c.addEventListener('mouseleave',()=>{clearInterval(t);n=0;img.src=raw(x.cover)})});

function bedInit(x){const B=x.sections.filter(s=>s.type==='bedroom');if(!B.length)return;const sel=i=>{$$('.tabs button').forEach((b,k)=>b.classList.toggle('on',k===i));$('#bd').textContent=B[i].detail||'';$('#bt').innerHTML=B[i].images.map((m,k)=>`<img src="${src(m)}" class="${k?'':'on'}" alt="${esc(B[i].title)} photo ${k+1}">`).join('');$('#bm').src=raw(B[i].images[0]);$$('#bt img').forEach(t=>t.onclick=()=>{$('#bm').src=t.src;$$('#bt img').forEach(z=>z.classList.toggle('on',z===t))})};$$('.tabs button').forEach((b,i)=>b.onclick=()=>sel(i));sel(0)}

A.innerHTML=`<div class="lh"><a href="#stays" data-go="stays">← All stays</a><h1 style="font-size:clamp(38px,6vw,78px);margin-top:10px">${esc(x.name)}</h1><div class="chips"><span>${esc(x.area||'Islamabad')}</span><span>${nb} bedrooms</span>${x.guests?`<span>${esc(x.guests)} guests</span>`:''}${x.baths?`<span>${esc(x.baths)} baths</span>`:''}</div><p style="margin:16px 0 0"><a class="cta" href="${waLink(x.id)}" target="_blank" rel="noopener">Book direct on WhatsApp ↗</a></p><div class="vw"><img id="vm" class="vmain" alt="${esc(x.name)}"><button type="button" class="nv p" data-n="-1" aria-label="Previous">‹</button><button type="button" class="nv n" data-n="1" aria-label="Next">›</button><span class="vcnt" id="vc"></span></div><div class="vt" id="vt"></div></div>
<div class="lay"><div>${x.desc?`<p style="max-width:62ch;margin-bottom:34px">${esc(x.desc)}</p>`:''}<div class="chips">${x.amenities.map(a=>`<span>${esc(a)}</span>`).join('')}</div><div style="margin-top:44px">${secs(x)}</div></div>
<aside class="book"><div><b style="font:500 32px Fraunces,serif">${fmt(x.price)}</b> / night</div><input type="date" id="ci" aria-label="Check-in"><input type="date" id="co" aria-label="Check-out"><input type="number" id="gu" min="1" value="2" aria-label="Guests"><div class="est" id="est"></div><input id="bn" placeholder="Your name" aria-label="Your name"><input id="bp" type="tel" placeholder="Phone / WhatsApp" aria-label="Phone"><textarea id="bnote" rows="2" placeholder="Notes (optional)" aria-label="Notes" style="width:100%;padding:11px 14px;border:1px solid #d5dbe8;border-radius:14px;font:inherit"></textarea><input id="bh" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button type="button" class="cta" id="bs">Send booking request</button><div id="bmsg" style="font-size:14px"></div><a class="cta alt" id="bw" target="_blank" rel="noopener">Or book on WhatsApp</a>${x.airbnb?`<a class="cta alt" href="${esc(x.airbnb)}" target="_blank" rel="noopener">Book on Airbnb</a>`:''}</aside></div>`;
const u=()=>{const a=$('#ci').value,c=$('#co').value,n=a&&c?Math.round((new Date(c)-new Date(a))/864e5):0;$('#est').textContent=n>0?`${n} night${n>1?'s':''} · about ${fmt(n*x.price)}`:'Pick your dates for an estimate';

$('#bs').onclick=async()=>{const a=$('#ci').value,c=$('#co').value,n=a&&c?Math.round((new Date(c)-new Date(a))/864e5):0,nm=$('#bn').value.trim(),ph=$('#bp').value.trim(),m=$('#bmsg');const say=(t,ok)=>{m.textContent=t;m.style.color=ok?'#1a7f4b':'#c0392b'};
if(!nm||!ph)return say('Please enter your name and phone.');if(n<1)return say('Please choose check-in and check-out dates.');
$('#bs').disabled=true;try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listingId:x.id,listing:x.name,name:nm,phone:ph,checkIn:a,checkOut:c,nights:n,guests:$('#gu').value,total:n*x.price,notes:$('#bnote').value,website:$('#bh').value})});if(!r.ok)throw 0;say('Request sent! We will contact you shortly to confirm.',1);['bn','bp','bnote'].forEach(k=>$('#'+k).value='')}catch(e){say('Could not send online. Please use the WhatsApp button.')}$('#bs').disabled=false};
slider(x);bedInit(x);['ci','co','gu'].forEach(k=>$('#'+k).oninput=u);$('#ci').min=new Date().toISOString().slice(0,10);u();
if(sec!=null&&x.sections[sec]){const S=x.sections[sec];if(S.type==='bedroom'){const bi=x.sections.filter(z=>z.type==='bedroom').indexOf(S);const bt=$$('.tabs button')[bi];bt&&bt.click()}setTimeout(()=>{const el=S.type==='bedroom'?$('[data-bed]'):$('[data-s="'+sec+'"]');if(el){el.classList.add('in');el.scrollIntoView({behavior:'smooth',block:'start'})}},120)}
$$('.gal img,#bm,#vm').forEach(i=>i.onclick=()=>{const l=document.createElement('div');l.className='lb';l.innerHTML='<img alt="">';l.firstChild.src=i.src;l.onclick=()=>l.remove();document.body.append(l)});reveal()}
function route(){const m=location.hash.match(/^#\/stay\/([^/]+)(?:\/(\d+))?/);if(m)return showStay(m[1],m[2]==null?null:+m[2]);document.title='Sapphire Suites | Premium apartments in Islamabad';$('#home').hidden=false;$('#app').hidden=true;const t=location.hash.slice(1);if(/^\w+$/.test(t)&&$('#'+t))setTimeout(()=>$('#'+t).scrollIntoView(),0);else scrollTo(0,0);reveal()}
function go(id,sec){if(L.some(l=>l.id===id)){showStay(id,sec);try{history.replaceState(null,'','#/stay/'+id+(sec!=null?'/'+sec:''))}catch(e){}return}
$('#home').hidden=false;$('#app').hidden=true;document.title='Sapphire Suites | Premium apartments in Islamabad';try{history.replaceState(null,'','#'+(id==='top'?'':id))}catch(e){}
setTimeout(()=>{const t=id==='top'?null:document.getElementById(id);t?t.scrollIntoView():scrollTo(0,0)},0);reveal()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');const bk=e.target.closest('[data-book]');if(bk){e.preventDefault();window.open(waLink(bk.dataset.book),'_blank','noopener');return}
if(a){e.preventDefault();go(a.dataset.go,a.dataset.sec==null?null:+a.dataset.sec)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('opt')||e.target.classList.contains('bk')){e.preventDefault();e.target.click()}});
addEventListener('hashchange',route);route();
})();
</script></body></html>
